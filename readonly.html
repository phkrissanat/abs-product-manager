<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ABS Product Manager — Read Only</title>
  <meta name="theme-color" content="#020c18">
  <script>
    // Applied synchronously, before styles load, so there's no flash of the
    // wrong mode on page load for returning visitors.
    (function () {
      try {
        if (localStorage.getItem('abs_theme') === 'light') document.documentElement.dataset.theme = 'light';
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    :root {
      --bg: #020c18;
      --bg2: #030f1e;
      --bg3: #041526;
      --surface: rgba(0, 20, 40, .85);
      --cyan: #00e5ff;
      --cyan2: #00b8d9;
      --cyan3: #7df4ff;
      --border: rgba(0, 229, 255, .18);
      --border2: rgba(0, 229, 255, .4);
      --text: #cdf4ff;
      --text2: rgba(180, 240, 255, .7);
      --text3: rgba(100, 200, 230, .5);
      --green: #39ff14;
      --red: #ff4466;
      --amber: #ffaa00;
      --mono: 'Orbitron', monospace;
      --sans: 'Sarabun', sans-serif;
      --r: 5px;
      --header-h: 64px;
    }

    /* ═══════════════════════════════════════════════════════════════
       LIGHT MODE — toggled via [data-theme="light"] on <html>
       ═══════════════════════════════════════════════════════════════ */
    :root[data-theme="light"] {
      --bg: #eef3f7;
      --bg2: #ffffff;
      --bg3: #e4ecf3;
      --surface: rgba(255, 255, 255, .9);
      --cyan: #0089a3;
      --cyan2: #00707f;
      --cyan3: #006884;
      --border: rgba(0, 105, 130, .2);
      --border2: rgba(0, 105, 130, .4);
      --text: #12303a;
      --text2: rgba(20, 55, 65, .72);
      --text3: rgba(20, 55, 65, .5);
      --green: #178a3e;
      --red: #c0273c;
      --amber: #b3650a;
    }
    :root[data-theme="light"] body {
      background-image: linear-gradient(rgba(0, 105, 130, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 105, 130, .05) 1px, transparent 1px);
    }
    :root[data-theme="light"] .logo { text-shadow: none; }
    :root[data-theme="light"] .code-val { background: rgba(0, 105, 130, .07); }
    :root[data-theme="light"] .pill-a { background: rgba(23, 138, 62, .1); }
    :root[data-theme="light"] .pill-i { background: rgba(192, 39, 60, .1); }
    :root[data-theme="light"] .pill-p { background: rgba(179, 101, 10, .1); }
    :root[data-theme="light"] tbody tr:hover td { background: rgba(0, 105, 130, .045) }
    :root[data-theme="light"] tr.row-selected td { background: rgba(0, 105, 130, .09) !important }
    :root[data-theme="light"] .tbl-wrap { box-shadow: 0 5px 24px rgba(20, 55, 65, .1); }
    :root[data-theme="light"] .theme-toggle:hover { transform: rotate(-20deg); }

    * { box-sizing: border-box; margin: 0; padding: 0 }

    html, body { max-width: 100vw; overflow-x: hidden; }

    body {
      font-family: var(--sans);
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      background-image: linear-gradient(rgba(0, 180, 220, .04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 180, 220, .04) 1px, transparent 1px);
      background-size: 28px 28px;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    ::-webkit-scrollbar { width: 8px; height: 8px }
    ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, .25); border-radius: 4px }

    .hdr {
      height: var(--header-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      background: linear-gradient(180deg, var(--bg3), var(--bg2));
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 20px rgba(0, 229, 255, .05);
    }

    .logo {
      font-family: var(--mono);
      font-weight: 900;
      font-size: 20px;
      letter-spacing: 3px;
      color: var(--cyan);
      text-shadow: 0 0 12px rgba(0, 229, 255, .5);
      white-space: nowrap;
    }

    .logo span {
      font-family: var(--sans);
      font-weight: 400;
      font-size: 11px;
      letter-spacing: 1px;
      color: var(--text3);
      margin-left: 8px;
      text-transform: uppercase;
    }

    .ro-badge {
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--amber);
      background: rgba(255, 170, 0, .1);
      border: 1px solid rgba(255, 170, 0, .35);
      padding: 3px 8px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .view-counter {
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--cyan3);
      background: rgba(0, 229, 255, .07);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 3px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .stats { display: flex; gap: 16px; margin-left: auto; flex-wrap: wrap; font-size: 13px; }
    .stat { display: flex; align-items: center; gap: 5px; white-space: nowrap; }
    .stat b { font-family: var(--mono); font-size: 15px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .dot.cyan { background: var(--cyan); box-shadow: 0 0 6px var(--cyan) }
    .dot.green { background: var(--green); box-shadow: 0 0 6px var(--green) }
    .dot.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber) }
    .dot.red { background: var(--red); box-shadow: 0 0 6px var(--red) }

    .theme-toggle {
      flex-shrink: 0;
      width: 34px; height: 34px;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 229, 255, .06);
      border: 1px solid var(--border2);
      color: var(--cyan3);
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      transition: background .15s, transform .2s;
    }
    .theme-toggle:hover { background: rgba(0, 229, 255, .14); transform: rotate(20deg); }

    .toolbar {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      background: var(--bg3);
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
    }

    .toolbar input, .toolbar select {
      background: var(--bg2);
      border: 1.5px solid var(--border2);
      color: var(--text);
      border-radius: var(--r);
      padding: 8px 12px;
      font-family: var(--sans);
      font-size: 13px;
      font-weight: 600;
      outline: none;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .12);
    }

    .toolbar input::placeholder { color: var(--text2); font-weight: 400; }
    .toolbar input:focus, .toolbar select:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(0, 137, 163, .18) }
    .toolbar input#q { flex: 1 1 200px; min-width: 140px; }
    .toolbar select option { background: var(--bg2); color: var(--text); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 229, 255, .06);
      border: 1px solid var(--border2);
      color: var(--cyan3);
      padding: 8px 14px;
      border-radius: var(--r);
      font-family: var(--sans);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, box-shadow .15s;
    }

    .btn:hover { background: rgba(0, 229, 255, .14); box-shadow: 0 0 14px rgba(0, 229, 255, .25) }
    .btn:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
    .btn.green { border-color: rgba(57, 255, 20, .4); color: var(--green); }
    .btn.green:hover { background: rgba(57, 255, 20, .1); box-shadow: 0 0 14px rgba(57, 255, 20, .25) }
    .btn.indigo { border-color: rgba(129, 140, 248, .4); color: #a5b4fc; }
    .btn.indigo:hover { background: rgba(129, 140, 248, .1); box-shadow: 0 0 14px rgba(129, 140, 248, .25) }

    .sel-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text2);
      white-space: nowrap;
    }
    .sel-count b { color: var(--cyan); }

    .content { flex: 1; overflow: auto; padding: 16px 20px 40px; }

    .tbl-wrap {
      border: 1px solid var(--border);
      border-radius: var(--r);
      overflow-x: auto;
      background: var(--bg2);
      box-shadow: 0 5px 30px rgba(0, 0, 0, .6);
    }

    table { width: 100%; border-collapse: collapse; font-size: 14px; }

    th {
      background: rgba(0, 229, 255, .06);
      color: var(--cyan3);
      text-align: left;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: .5px;
      text-transform: uppercase;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 9px 12px;
      border-bottom: 1px solid rgba(0, 229, 255, .06);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none }
    tbody tr:hover td { background: rgba(0, 229, 255, .04) }
    tr.row-selected td { background: rgba(0, 229, 255, .08) !important }
    tr.row-inactive { opacity: .35 }

    .code-val {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--cyan3);
      background: rgba(0, 229, 255, .08);
      border: 1px solid var(--border);
      padding: 3px 7px;
      border-radius: 3px;
      white-space: nowrap;
    }

    .badge-new, .badge-pnd {
      display: inline-block;
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 2px 6px;
      border-radius: 2px;
      color: #fff;
      white-space: nowrap;
    }
    .badge-new { background: linear-gradient(135deg, #dc2626, #ff4466) }
    .badge-pnd { background: linear-gradient(135deg, #b45309, #f59e0b) }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .pill-a { background: rgba(57, 255, 20, .1); color: var(--green); border: 1px solid rgba(57, 255, 20, .3) }
    .pill-i { background: rgba(255, 68, 102, .1); color: var(--red); border: 1px solid rgba(255, 68, 102, .3) }
    .pill-p { background: rgba(255, 170, 0, .1); color: var(--amber); border: 1px solid rgba(255, 170, 0, .3) }

    .grp-txt { color: var(--text2); font-size: 12.5px; }
    .grp-txt b { color: var(--text); }

    input[type=checkbox] {
      width: 17px; height: 17px; accent-color: var(--cyan); cursor: pointer; vertical-align: middle;
    }

    .empty { text-align: center; padding: 60px 20px; color: var(--text3); font-size: 14px; }

    #syncStatus {
      position: fixed; bottom: 10px; right: 10px; z-index: 900; font-family: var(--mono); font-size: 11px;
      padding: 5px 10px; border-radius: 4px; background: rgba(0, 20, 40, .9); color: var(--cyan);
      border: 1px solid rgba(0, 229, 255, .4); letter-spacing: .5px; opacity: .85;
    }

    @media (max-width: 900px) {
      .hdr { padding: 0 12px; gap: 8px; }
      .logo span { display: none; }
      .view-counter { flex-shrink: 0; font-size: 10px; }
      .stats { gap: 10px; font-size: 12px; overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
      .stat { flex-shrink: 0; }
      .toolbar { padding: 10px 12px; gap: 8px; }
      .content { padding: 10px 10px 30px; }

      /* Single-line rows: checkbox/badge/code/name stay frozen on the left,
         Unit/Status swipe into view from the outer table scroll. A nested
         horizontal-scroll-within-the-name approach was tried but was
         unreliable on real touch devices (gesture conflicts with the outer
         scroll, and visual glitches while scrolling) — instead, tapping a
         name toggles it between truncated and fully wrapped (row grows
         taller), which is far more reliable across devices. */
      table { font-size: 12.5px; table-layout: fixed; width: 100%; }
      th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; z-index: 2; width: 32px !important; background: var(--bg2); padding-left: 8px !important; padding-right: 2px !important; }
      th:nth-child(2), td:nth-child(2) { position: sticky; left: 32px; z-index: 2; width: 38px !important; background: var(--bg2); padding-left: 3px !important; padding-right: 2px !important; overflow: hidden; }
      .badge-new, .badge-pnd { font-size: 7px; letter-spacing: 0; padding: 1px 3px; }
      th:nth-child(3), td:nth-child(3) { position: sticky; left: 70px; z-index: 2; width: 78px !important; background: var(--bg2); }
      td:nth-child(3) .code-val { font-size: 10px; padding: 2px 4px; }
      th:nth-child(4), td:nth-child(4) {
        position: sticky; left: 148px; z-index: 2; width: 210px !important; background: var(--bg2);
        box-shadow: 6px 0 8px -6px rgba(0, 0, 0, .5); /* hints there's more to swipe further right (Unit/Status) */
      }
      td:nth-child(4) .name-txt {
        display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer;
      }
      td:nth-child(4) .name-txt::after { content: ' ▸'; color: var(--cyan3); font-size: 10px; }
      td:nth-child(4) .name-txt.expanded {
        white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word;
      }
      td:nth-child(4) .name-txt.expanded::after { content: ' ▾'; }
      th:nth-child(5), td:nth-child(5) { display: none; } /* Group/Category — dropped on mobile in favor of the name */
      th:nth-child(6), td:nth-child(6) { width: 54px !important; }
      th:nth-child(7), td:nth-child(7) { width: 84px !important; }
      td:nth-child(7) .pill { font-size: 10px; padding: 2px 6px; }
    }
  </style>
</head>

<body>

  <div class="hdr">
    <div class="logo">ABS<span>Product Manager</span></div>
    <div class="ro-badge">READ ONLY</div>
    <div class="view-counter" id="viewCounter" title="จำนวนครั้งที่เปิดหน้านี้">&#128065; <span id="viewCountNum">–</span></div>
    <div class="stats" id="stats"></div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="สลับโหมดสว่าง/มืด">&#9788;</button>
  </div>

  <div class="toolbar">
    <input type="text" id="q" placeholder="ค้นหา รหัส / ชื่อ / กลุ่ม..." oninput="applyFilters()">
    <select id="fCat" onchange="onCategoryChange()"><option value="">ทุกหมวดหมู่</option></select>
    <select id="fGrp" onchange="applyFilters()"><option value="">ทุกกลุ่ม</option></select>
    <select id="fStatus" onchange="applyFilters()">
      <option value="">ทุกสถานะ</option>
      <option value="active">Active</option>
      <option value="pending">Pending</option>
      <option value="inactive">Inactive</option>
    </select>
    <span class="sel-count" id="selCount">เลือก 0 รายการ</span>
    <button class="btn indigo" onclick="exportPDF()">&#128438; Export PDF</button>
    <button class="btn green" onclick="exportExcel()">&#128202; Export Excel</button>
  </div>

  <div class="content">
    <div class="tbl-wrap">
      <table>
        <thead>
          <tr>
            <th><input type="checkbox" id="selectAll" onchange="toggleSelectAll(this.checked)"></th>
            <th></th>
            <th>Code</th>
            <th>Name</th>
            <th>Group / Category</th>
            <th>Unit</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none">ไม่พบรายการที่ตรงกับตัวกรอง</div>
    </div>
  </div>

  <div id="syncStatus">กำลังโหลด...</div>

  <script>
    const $ = id => document.getElementById(id);
    const esc = s => String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function syncThemeIcon() {
      const isLight = document.documentElement.dataset.theme === 'light';
      $('themeToggle').innerHTML = isLight ? '&#9789;' : '&#9788;'; // moon : sun
      $('themeToggle').title = isLight ? 'สลับเป็นโหมดมืด' : 'สลับเป็นโหมดสว่าง';
    }
    function toggleTheme() {
      const isLight = document.documentElement.dataset.theme === 'light';
      if (isLight) { delete document.documentElement.dataset.theme; localStorage.setItem('abs_theme', 'dark'); }
      else { document.documentElement.dataset.theme = 'light'; localStorage.setItem('abs_theme', 'light'); }
      syncThemeIcon();
    }
    syncThemeIcon();

    let products = [];
    let filtered = [];
    const selected = new Set(); // selected item codes

    function getStatus(p) { return p.status || (p.active ? 'active' : 'inactive'); }

    // ── Instant paint from local cache (same-origin localStorage the main
    // app already writes to), then refine once Firestore responds ──────────
    try {
      const cached = localStorage.getItem('abs_products');
      if (cached) { products = JSON.parse(cached); }
    } catch (e) { /* ignore bad cache */ }

    function setSyncStatus(text, ok) {
      const el = $('syncStatus');
      el.textContent = text;
      el.style.borderColor = ok ? 'rgba(57,255,20,.5)' : 'rgba(255,170,0,.5)';
      el.style.color = ok ? '#39ff14' : '#ffaa00';
    }

    // Naming follows the main app's convention: the "Category" dropdown
    // filters the broad/top-level field (productGroup, e.g. "cargobox"),
    // and "Group" filters the narrower sub-level field (category, e.g.
    // "ตู้แห้ง/ตู้เย็น") — Group's options are limited to whatever exists
    // inside the currently selected Category, to avoid confusion.
    function populateFilterOptions() {
      const catSel = $('fCat'), grpSel = $('fGrp');
      const curCat = catSel.value, curGrp = grpSel.value;
      const cats = [...new Set(products.map(p => p.productGroup))].filter(Boolean).sort();
      catSel.innerHTML = '<option value="">ทุกหมวดหมู่</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
      catSel.value = cats.includes(curCat) ? curCat : '';
      populateGroupOptions(catSel.value, curGrp);
    }

    function populateGroupOptions(selectedCat, keepGrp) {
      const grpSel = $('fGrp');
      const pool = selectedCat ? products.filter(p => p.productGroup === selectedCat) : products;
      const grps = [...new Set(pool.map(p => p.category))].filter(Boolean).sort();
      grpSel.innerHTML = '<option value="">ทุกกลุ่ม</option>' + grps.map(g => `<option value="${esc(g)}">${esc(g)}</option>`).join('');
      grpSel.value = grps.includes(keepGrp) ? keepGrp : '';
    }

    function onCategoryChange() {
      populateGroupOptions($('fCat').value, ''); // category changed — group no longer applies, reset it
      applyFilters();
    }

    function renderStats() {
      const total = products.length;
      const active = products.filter(p => getStatus(p) === 'active').length;
      const pending = products.filter(p => getStatus(p) === 'pending').length;
      const inactive = products.filter(p => getStatus(p) === 'inactive').length;
      const isNew = products.filter(p => p.isNew).length;
      $('stats').innerHTML = `
        <div class="stat"><span class="dot cyan"></span><b>${total}</b> Total</div>
        <div class="stat"><span class="dot green"></span><b>${active}</b> Active</div>
        <div class="stat"><span class="dot amber"></span><b>${pending}</b> Pending</div>
        <div class="stat"><span class="dot red"></span><b>${inactive}</b> Inactive</div>
        <div class="stat"><span class="dot red"></span><b>${isNew}</b> NEW</div>`;
    }

    function applyFilters() {
      const q = $('q').value.trim().toLowerCase();
      const fc = $('fCat').value, fg = $('fGrp').value, fs = $('fStatus').value;
      filtered = products.filter(p => {
        if (fc && p.productGroup !== fc) return false;
        if (fg && p.category !== fg) return false;
        if (fs && getStatus(p) !== fs) return false;
        if (q && !((p.code || '').toLowerCase().includes(q) || (p.name || '').toLowerCase().includes(q) ||
          (p.category || '').toLowerCase().includes(q) || (p.productGroup || '').toLowerCase().includes(q))) return false;
        return true;
      });
      renderTable();
    }

    function renderTable() {
      const tbody = $('tbody');
      $('emptyMsg').style.display = filtered.length ? 'none' : 'block';
      tbody.innerHTML = filtered.map(p => {
        const st = getStatus(p);
        const pillCls = st === 'active' ? 'pill-a' : st === 'inactive' ? 'pill-i' : 'pill-p';
        const pillTxt = st === 'active' ? 'Active' : st === 'inactive' ? 'Inactive' : 'Pending';
        const badge = p.isNew ? '<span class="badge-new">NEW</span>' : (st === 'pending' ? '<span class="badge-pnd">PENDING</span>' : '');
        const rowCls = [(st === 'inactive' ? 'row-inactive' : ''), (selected.has(p.code) ? 'row-selected' : '')].filter(Boolean).join(' ');
        return `<tr class="${rowCls}">
          <td><input type="checkbox" data-code="${esc(p.code)}" onchange="toggleOne('${esc(p.code)}', this.checked)" ${selected.has(p.code) ? 'checked' : ''}></td>
          <td>${badge}</td>
          <td><span class="code-val">${esc(p.code)}</span></td>
          <td><span class="name-txt" onclick="this.classList.toggle('expanded')">${esc(p.name)}</span></td>
          <td class="grp-txt"><b>${esc(p.productGroup)}</b> &rsaquo; ${esc(p.category)}</td>
          <td>${esc(p.unit)}</td>
          <td><span class="pill ${pillCls}">${pillTxt}</span></td>
        </tr>`;
      }).join('');
      updateSelCount();
    }

    function toggleOne(code, checked) {
      if (checked) selected.add(code); else selected.delete(code);
      updateSelCount();
      const row = document.querySelector(`input[data-code="${CSS.escape(code)}"]`)?.closest('tr');
      if (row) row.classList.toggle('row-selected', checked);
    }

    function toggleSelectAll(checked) {
      filtered.forEach(p => { if (checked) selected.add(p.code); else selected.delete(p.code); });
      renderTable();
    }

    function updateSelCount() {
      $('selCount').innerHTML = `เลือก <b>${selected.size}</b> รายการ`;
      const allChecked = filtered.length > 0 && filtered.every(p => selected.has(p.code));
      $('selectAll').checked = allChecked;
      $('selectAll').indeterminate = !allChecked && filtered.some(p => selected.has(p.code));
    }

    function exportList() {
      // Export the selection if anything is checked; otherwise export
      // everything currently visible under the active search/filter.
      return selected.size ? products.filter(p => selected.has(p.code)) : filtered;
    }

    function exportPDF() {
      const data = exportList();
      if (!data.length) { alert('ไม่มีรายการให้ export'); return; }
      const date = new Date().toLocaleDateString('th-TH', { year: 'numeric', month: 'long', day: 'numeric' });
      let no = 1;
      const rows = data.map(p => {
        const st = getStatus(p);
        const stColor = st === 'active' ? '#15803d' : st === 'inactive' ? '#b91c1c' : '#92400e';
        return `<tr><td style="text-align:center;color:#999">${no++}</td>
          <td style="font-family:monospace;color:#1a4a8a;font-weight:700">${esc(p.code)}</td>
          <td>${esc(p.name)}</td>
          <td>${esc(p.productGroup)} / ${esc(p.category)}</td>
          <td style="text-align:center">${esc(p.unit)}</td>
          <td style="text-align:center;color:${stColor};font-weight:700">${st.charAt(0).toUpperCase() + st.slice(1)}</td></tr>`;
      }).join('');
      const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>ABS Product List</title>
        <style>body{font-family:'Noto Sans Thai',Arial,sans-serif;margin:0;padding:20px;font-size:12pt;color:#1a1a1a}
        h1{font-size:16pt;margin:0 0 4px} .sub{font-size:10pt;color:#666;margin-bottom:14px}
        table{width:100%;border-collapse:collapse;border:1px solid #1a2e4a}
        th{background:#1a2e4a;color:#fff;padding:6px 9px;font-size:10pt;text-align:left}
        td{border-bottom:1px solid #e0e8f0;padding:5px 9px;font-size:10pt}
        tr:nth-child(even) td{background:#f0f6ff}
        @page{size:A4 portrait;margin:12mm 10mm}</style></head><body>
        <h1>ABS PRODUCT LIST (Read Only Export)</h1>
        <div class="sub">Date: ${date} &nbsp;|&nbsp; Items: ${data.length}${selected.size ? ' (selected)' : ''}</div>
        <table><thead><tr><th style="width:30px">#</th><th style="width:120px">Code</th><th>Name</th>
        <th style="width:150px">Group / Category</th><th style="width:50px">Unit</th><th style="width:70px">Status</th>
        </tr></thead><tbody>${rows}</tbody></table>
        <script>setTimeout(()=>window.print(),400);<\/script></body></html>`;
      const win = window.open('', '_blank', 'width=900,height=700');
      win.document.write(html);
      win.document.close();
    }

    function exportExcel() {
      if (typeof XLSX === 'undefined') { alert('โหลดไลบรารี Excel ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ตแล้วลองใหม่'); return; }
      const data = exportList();
      if (!data.length) { alert('ไม่มีรายการให้ export'); return; }
      const rows = [['Code', 'Name', 'Group', 'Category', 'Unit', 'Status']];
      data.forEach(p => rows.push([p.code, p.name, p.productGroup, p.category, p.unit, getStatus(p)]));
      const ws = XLSX.utils.aoa_to_sheet(rows);
      ws['!cols'] = [{ wch: 18 }, { wch: 46 }, { wch: 18 }, { wch: 18 }, { wch: 8 }, { wch: 10 }];
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Products');
      const stamp = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(wb, `abs-products-${stamp}.xlsx`);
    }

    function refreshAll() {
      populateFilterOptions();
      renderStats();
      applyFilters();
    }

    if (products.length) refreshAll();

    // ═══════════════════════════════════════════════════════════════════
    // FIREBASE (read-only, no login): reads the fixed owner's document
    // directly — no email/password prompt, since this page can't edit
    // anything anyway. Requires Firestore rules to allow public READ on
    // this one document (write stays restricted to the real owner).
    // ═══════════════════════════════════════════════════════════════════
    (function () {
      const cfg = window.FIREBASE_CONFIG || {};
      const ownerUid = window.ABS_OWNER_UID;
      if (!cfg.apiKey || cfg.apiKey === 'YOUR_API_KEY') {
        setSyncStatus(products.length ? 'ข้อมูลจากเครื่องนี้ (ยังไม่ตั้งค่า Firebase)' : 'ยังไม่ตั้งค่า Firebase', false);
        return;
      }
      if (!ownerUid || ownerUid === 'YOUR_UID') {
        setSyncStatus(products.length ? 'ข้อมูลจากเครื่องนี้ (ยังไม่ตั้งค่า Owner UID)' : 'ยังไม่ตั้งค่า Owner UID', false);
        return;
      }
      if (typeof firebase === 'undefined') {
        setSyncStatus(products.length ? 'ข้อมูลจากเครื่องนี้ (โหลด Firebase ไม่สำเร็จ)' : 'โหลด Firebase ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต', false);
        return;
      }
      firebase.initializeApp(cfg);
      const db = firebase.firestore();

      // View counter — separate doc from the product data, incremented once per
      // page load. Requires a `stats/readonly_views` doc to already exist (create
      // it once manually with a `count` field) and Firestore Rules that allow a
      // public update ONLY when it increases the count by exactly 1 (see setup notes).
      (function bumpViewCounter() {
        const ref = db.collection('stats').doc('readonly_views');
        ref.update({
          count: firebase.firestore.FieldValue.increment(1),
          lastViewedAt: Date.now()
        }).catch((err) => {
          console.error('[view-counter] increment failed — has stats/readonly_views been created and rules updated?', err);
        });
        ref.onSnapshot((snap) => {
          $('viewCountNum').textContent = (snap.exists && typeof snap.data().count === 'number')
            ? snap.data().count.toLocaleString('th-TH') : '–';
        }, () => { $('viewCountNum').textContent = '–'; });
      })();

      db.collection('abs_sync').doc(ownerUid).onSnapshot((snap) => {
        if (!snap.exists) { setSyncStatus('ยังไม่มีข้อมูลบนคลาวด์', true); return; }
        try {
          const remote = JSON.parse(snap.data().productsJson || '[]');
          products = remote;
          localStorage.setItem('abs_products', snap.data().productsJson);
          refreshAll();
          setSyncStatus('ข้อมูลล่าสุด (ซิงค์แล้ว)', true);
        } catch (e) { console.error(e); }
      }, (err) => {
        console.error(err);
        setSyncStatus(products.length ? 'ข้อมูลจากเครื่องนี้ (ออฟไลน์)' : 'โหลดข้อมูลไม่สำเร็จ', false);
      });
    })();
  </script>
</body>

</html>
